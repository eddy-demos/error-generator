name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend (pytest)
    runs-on: tenki-standard-medium-4c-8g
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run pytest
        env:
          DATABASE_URL: sqlite:///./errors.db
        run: pytest -v

  backend-migrations:
    name: Backend (alembic + seed)
    runs-on: tenki-standard-medium-4c-8g
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alembic migrations
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: alembic upgrade head

      - name: Seed database
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: python seed.py

      - name: Boot API and hit /healthz
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/healthz; then
              echo "healthy"
              break
            fi
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8000/api/generate \
            -H 'Content-Type: application/json' -d '{}' | tee /dev/stderr | grep -q '"seed"'
          kill $SERVER_PID

  frontend-test:
    name: Frontend (vitest + tsc + build)
    runs-on: tenki-standard-medium-4c-8g
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check & build
        run: pnpm build

      - name: Run vitest
        run: pnpm test

  docker-build:
    name: Docker build (compose)
    runs-on: tenki-standard-medium-4c-8g
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images (no cache push)
        run: docker compose build

      - name: Smoke-test compose stack
        run: |
          docker compose up -d
          # Wait for backend to be reachable
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/api/healthz; then
              echo "backend up"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/healthz
          curl -fsS -X POST http://127.0.0.1:8000/api/generate \
            -H 'Content-Type: application/json' -d '{}'
          docker compose down -v

  security-scan:
    name: Security scan (pip-audit + npm audit)
    runs-on: tenki-standard-medium-4c-8g
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (frontend)
        working-directory: frontend
        run: |
          npm install --package-lock-only --no-audit --no-fund
          npm audit --audit-level=high || true